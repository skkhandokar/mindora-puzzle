name: Build Flutter AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create key.properties directly
        run: |
          echo "storePassword=Kibolle2mi" > android/app/key.properties
          echo "keyPassword=Kibolle2mi" >> android/app/key.properties
          echo "keyAlias=mindora-alias" >> android/app/key.properties
          echo "storeFile=mindora-release-key.jks" >> android/app/key.properties

      - name: Build App Bundle (.aab)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab