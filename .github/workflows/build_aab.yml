name: Build Flutter AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Keystore and key.properties
        run: |
          # সরাসরি GitHub Actions-এর ভেতরেই ফ্রেশ রিলিজ কি-স্টোর জেনারেট করা
          keytool -genkey -v -keystore android/app/mindora-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ${{ secrets.KEY_ALIAS }} -keypass ${{ secrets.KEY_PASSWORD }} -storepass ${{ secrets.STORE_PASSWORD }} -dname "CN=Android, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=US"
          
          # key.properties ফাইল তৈরি করা
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/app/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/key.properties
          echo "storeFile=mindora-release-key.jks" >> android/app/key.properties

      - name: Build App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab 