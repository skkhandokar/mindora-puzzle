name: Mindora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_database: ^13.0.0
  image_picker: ^1.2.3
  audioplayers: ^6.7.1
  firebase_storage: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


flutter:
  uses-material-design: true

  assets:
    - assets/audio/


flutter_icons:
  image_path: "assets/icon/app_icon.png" # আপনার লোগো ইমেজটি এই পাথ এ রাখবেন
  android: true
  ios: true



flutter_native_splash:
  color: "#0B0C10" 
  image: "assets/icon/splash_logo.png" 
  android: true
  ios: true      